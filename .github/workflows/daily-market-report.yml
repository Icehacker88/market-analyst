name: Daily Market Report

on:
  schedule:
    # GitHub cron can be delayed or dropped. Spread retries across the Malaysia morning.
    - cron: "17 23 * * *" # 07:17 Asia/Kuala_Lumpur
    - cron: "47 23 * * *" # 07:47 Asia/Kuala_Lumpur
    - cron: "17 0 * * *"  # 08:17 Asia/Kuala_Lumpur
    - cron: "47 0 * * *"  # 08:47 Asia/Kuala_Lumpur
    - cron: "17 1 * * *"  # 09:17 Asia/Kuala_Lumpur
    - cron: "17 2 * * *"  # 10:17 Asia/Kuala_Lumpur
    - cron: "17 4 * * *"  # 12:17 Asia/Kuala_Lumpur
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-market-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 股票预测

    steps:
      - name: Check whether today's report already succeeded
        id: dedupe
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            core.setOutput("skip", "false");
            if (context.eventName !== "schedule") {
              return;
            }

            try {
              const malaysiaDay = (value) => {
                const parts = new Intl.DateTimeFormat("en-US", {
                  timeZone: "Asia/Kuala_Lumpur",
                  year: "numeric",
                  month: "2-digit",
                  day: "2-digit",
                }).formatToParts(new Date(value));
                const values = Object.fromEntries(
                  parts.map(({ type, value }) => [type, value]),
                );
                return `${values.year}-${values.month}-${values.day}`;
              };
              const today = malaysiaDay(new Date());
              const { data } = await github.request(
                "GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: "daily-market-report.yml",
                  status: "success",
                  per_page: 20,
                },
              );
              const candidates = data.workflow_runs.filter(
                (run) =>
                  run.id !== context.runId
                  && malaysiaDay(run.created_at) === today,
              );
              let priorSuccess;
              for (const run of candidates) {
                const { data: artifactData } = await github.request(
                  "GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts",
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id,
                    per_page: 100,
                  },
                );
                const hasReportArtifact = artifactData.artifacts.some(
                  (artifact) =>
                    artifact.name === "daily-market-report" && !artifact.expired,
                );
                if (hasReportArtifact) {
                  priorSuccess = run;
                  break;
                }
              }
              core.setOutput("skip", priorSuccess ? "true" : "false");
              if (priorSuccess) {
                core.notice(
                  `Malaysia ${today} report artifact already exists in run ${priorSuccess.id}.`,
                );
              }
            } catch (error) {
              core.warning(`Dedupe check failed; continuing report generation: ${error.message}`);
            }

      - name: Checkout
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check for a newly completed US market session
        id: market_session
        if: steps.dedupe.outputs.skip != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python -m src.trading_session

      - name: Install dependencies
        if: steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        if: steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        run: python -m unittest discover -s tests -q

      - name: Generate daily market report
        if: steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        env:
          DISABLE_GPT_ANALYSIS: "true"
          GPT_NEWS_LIMIT: ${{ vars.GPT_NEWS_LIMIT || '12' }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'auto' }}
        run: |
          python main.py --daily-report --market-start 2024-01-01 --output-dir outputs

      - name: Show real prediction validation status
        if: steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        run: |
          validation_file="$(find outputs/daily_reports -name latest_prediction_validation.csv -type f | sort | tail -n 1)"
          metrics_file="$(find outputs/daily_reports -name prediction_ledger_metrics.csv -type f | sort | tail -n 1)"
          test -n "$validation_file"
          test -n "$metrics_file"
          echo "Latest completed prediction validations:"
          cat "$validation_file"
          echo "Prediction ledger metrics:"
          cat "$metrics_file"

      - name: Persist prediction ledger
        if: steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/prediction_ledger.csv
          if git diff --cached --quiet; then
            echo "Prediction ledger unchanged."
            exit 0
          fi
          git commit -m "Update prediction ledger"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push

      - name: Verify report email was sent
        if: steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        run: |
          status_file="$(find outputs/daily_reports -name email_status.txt -type f | sort | tail -n 1)"
          test -n "$status_file"
          cat "$status_file"
          grep -q '^邮件已发送至：' "$status_file"

      - name: Upload report artifact
        if: always() && steps.dedupe.outputs.skip != 'true' && steps.market_session.outputs.send == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-market-report
          path: 股票预测/outputs/daily_reports/**
