name: Daily Market Report

on:
  schedule:
    # Staggered retries at 08:10, 08:25, and 08:40 Asia/Kuala_Lumpur.
    - cron: "10 0 * * *"
    - cron: "25 0 * * *"
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-market-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 股票预测

    steps:
      - name: Check whether today's report already succeeded
        id: dedupe
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "schedule") {
              core.setOutput("skip", "false");
              return;
            }

            const now = new Date();
            const utcDayStart = new Date(Date.UTC(
              now.getUTCFullYear(),
              now.getUTCMonth(),
              now.getUTCDate(),
            ));
            const { data } = await github.rest.actions.listWorkflowRunsForWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "daily-market-report.yml",
              status: "success",
              per_page: 20,
            });
            const priorSuccess = data.workflow_runs.find(
              (run) => run.id !== context.runId && new Date(run.created_at) >= utcDayStart,
            );
            core.setOutput("skip", priorSuccess ? "true" : "false");
            if (priorSuccess) {
              core.notice(`Today's report already succeeded in run ${priorSuccess.id}.`);
            }

      - name: Checkout
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.dedupe.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily market report
        if: steps.dedupe.outputs.skip != 'true'
        env:
          DISABLE_GPT_ANALYSIS: "true"
          GPT_NEWS_LIMIT: ${{ vars.GPT_NEWS_LIMIT || '12' }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'auto' }}
        run: |
          python main.py --daily-report --market-start 2024-01-01 --output-dir outputs

      - name: Verify report email was sent
        if: steps.dedupe.outputs.skip != 'true'
        run: |
          status_file="$(find outputs/daily_reports -name email_status.txt -type f | sort | tail -n 1)"
          test -n "$status_file"
          cat "$status_file"
          grep -q '^邮件已发送至：' "$status_file"

      - name: Upload report artifact
        if: always() && steps.dedupe.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-report
          path: 股票预测/outputs/daily_reports/**
