name: PR Checks

# Runs for every pull request. Read-only: no secrets, no deployment,
# no writes to the repository, and no calls to the live Orivane site.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 股票预测/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 股票预测/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # functions/api/[[path]].ts is gitignored; build it from netlify/functions/api.mts.
      - name: Generate Cloudflare Worker
        run: node scripts/generate-cloudflare-worker.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 股票预测
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            股票预测/requirements.txt
            股票预测/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt

      - name: Analysis unit tests
        run: python -m unittest discover -s tests -q

      - name: Backend tests
        working-directory: 股票预测/backend
        run: python -m pytest -q
