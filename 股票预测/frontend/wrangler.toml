name = "orivane-market-intelligence"
pages_build_output_dir = "out"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ORIVANE_MARKET_DATA_PROVIDER = "free-yahoo-eastmoney"
ORIVANE_AI_DAILY_LIMIT = "20"

