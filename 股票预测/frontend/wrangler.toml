# Preview must never inherit production KV namespaces or service credentials.
# OAuth, AI generation, outbound mail and optimizer credentials are absent in Preview.
[env.preview.vars]
ORIVANE_MARKET_DATA_PROVIDER = "free-yahoo-eastmoney"
ORIVANE_AI_DAILY_LIMIT = "2"
ORIVANE_ADMIN_EMAILS = "preview-admin@orivane.test"
ORIVANE_SKIP_SEO_REFRESH = "1"
ORIVANE_SEO_API_BASE = "https://codex-auth-phase1-preview.orivane-market-intelligence.pages.dev"
ORIVANE_SITE_URL = "https://codex-auth-phase1-preview.orivane-market-intelligence.pages.dev"
NEXT_PUBLIC_SITE_URL = "https://codex-auth-phase1-preview.orivane-market-intelligence.pages.dev"

